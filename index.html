<head>

<meta name="description" content="Um Game Boy interativo para conhecer a Anaju — jogue para descobrir mais.">

<style>
  :root{
    --bg:#f3ece2;
    --ink:#1a1a1a;
    --screen:#9bbc0f;
    --accent:#e8006a;
    --font-ui:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{height:100%;}

  body{
    background-color:var(--bg);
    background-image:
      radial-gradient(60% 55% at 92% 100%, #ff8fc0 0%, #ffb0d3 28%, rgba(255,176,211,0.45) 50%, rgba(255,176,211,0) 72%),
      radial-gradient(38% 34% at 100% 78%, rgba(255,110,170,0.55) 0%, rgba(255,110,170,0) 70%);
    background-repeat:no-repeat;
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--font-ui);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}

  /* ============ MADE BY (bottom-left) ============ */
  .madeby{
    position:fixed;
    left:clamp(16px,4vw,40px);
    bottom:20px;
    z-index:50;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .madeby-avatar{
    width:32px;
    height:32px;
    border-radius:50%;
    object-fit:cover;
    flex:none;
  }

  .madeby-label{
    font-size:9.5px;
    letter-spacing:0.05em;
    color:#0007;
  }

  .madeby-name{
    margin-top:4px;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
    white-space:nowrap;
  }

  /* Page-level control, not part of the "physical buttons only" game —
     visible from the moment the tab opens (even during loading), since
     the background music starts immediately too. */
  .mute-btn{
    position:fixed;
    top:clamp(14px,3vh,28px);
    right:clamp(16px,4vw,40px);
    z-index:50;
    width:38px;height:38px;
    border-radius:50%;
    border:none;
    background:#fff;
    color:#333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
    transition:transform .12s ease;
  }
  .mute-btn svg{width:18px;height:18px;display:block;}
  .mute-btn:hover{transform:scale(1.06);}
  .mute-btn:active{transform:scale(0.94);}

  /* ============ HERO / STAGE ============ */
  .stage{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(8px,2vh,24px) clamp(8px,2vw,24px);
  }

  /* Game Boy targets ~90% of the available viewport height, capped so it
     never overflows the viewport width either (aspect-ratio 0.606). */
  .gb-wrap{
    position:relative;
    aspect-ratio:0.606;
    height:min(94dvh, calc(94vw / 0.606));
  }

  .gb-css3d,
  .gb-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .gb-css3d{
    overflow:hidden;
    z-index:1;
  }

  .gb-canvas{
    z-index:2;
    pointer-events:none;
    display:block;
  }

  .gb-wrap.is-loaded .gb-canvas{cursor:default;}

  .gb-loading{
    position:absolute;
    inset:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#0006;
    background:var(--bg);
    transition:opacity .5s ease;
    pointer-events:none;
  }
  .gb-loading.hide{opacity:0;}

  /* ============ MOBILE: fills the screen ============ */
  @media (max-width:640px){
    .stage{
      padding:10px 6px 16px;
      min-height:100dvh;
    }
    .gb-wrap{
      height:min(94dvh, calc(98vw / 0.606));
    }
    .madeby{left:16px;bottom:14px;}
    .madeby-avatar{width:26px;height:26px;font-size:10px;}
    .madeby-label{font-size:8px;}
    .madeby-name{font-size:10px;}
    .credit{right:16px;bottom:16px;max-width:120px;}
  }

  .credit{
    position:fixed;
    right:clamp(16px,4vw,40px);
    bottom:20px;
    z-index:50;
    text-align:right;
    font-size:9px;
    line-height:1.5;
    letter-spacing:0.02em;
    color:#0006;
    max-width:180px;
  }
  .credit a{text-decoration:underline;color:inherit;}

  /* ================================================================
     SCREEN CONTENT (rendered inside the 3D game boy's LCD via CSS3D)
     ================================================================ */
  .gbscr{
    /* Monochrome DMG-green ramp, darkest to lightest — every color inside
       the screen comes from this set, no other hues. */
    --g0:#0f380f;
    --g1:#306230;
    --g2:#8fae4d;
    --g3:#c9dc7f;
    --g4:#cfe6a0;
    width:380px;
    height:288px;
    background:var(--g3);
    position:relative;
    overflow:hidden;
    font-family:'Press Start 2P',monospace;
    -webkit-font-smoothing:none;
    user-select:none;
  }

  .gbscr,
  .gbscr *{
    -webkit-user-select:none;
    user-select:none;
  }

  .gbscr-lcd{
    position:absolute;inset:0;overflow:hidden;
    /* Rounded to match the bezel's own window — the CSS3D screen behind
       it is deliberately a hair oversized (see OVERSCAN in the JS) so it
       always fully covers the stencil-punched hole, but that oversized
       rect is sharp-cornered; rounding + clipping the actual visible fill
       here keeps it from ever poking past the bezel's rounded corner. */
    border-radius:16px;
    background:var(--g3);
    box-shadow:
      inset 0 4px 10px rgba(0,0,0,.45),
      inset 0 -3px 8px rgba(0,0,0,.3),
      inset 0 0 0 2px rgba(0,0,0,.12);
    transition:filter .15s ease;
  }

  .gbscr-lcd.gb-boot{
    animation:gbFlicker .7s steps(1,end) 1;
  }
  @keyframes gbFlicker{
    0%{filter:brightness(0);}
    8%{filter:brightness(1);}
    16%{filter:brightness(0);}
    28%{filter:brightness(1);}
    38%{filter:brightness(0.15);}
    55%{filter:brightness(1);}
    100%{filter:brightness(1);}
  }
  .gbscr-lcd.gb-off{filter:brightness(0);}

  .gbscr-scene{
    position:absolute;inset:0;
    background-color:var(--g3);
  }

  .gbscr-hud{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:190px;z-index:6;text-align:center;
  }
  .gbscr-hud-label{
    font-size:7.5px;color:var(--g0);letter-spacing:1px;margin-bottom:5px;
  }
  /* Heart + bar are one piece: the heart sits half-overlapping the bar's
     left end, same as the reference, and stays a plain solid icon — only
     the bar itself (and the "+N pts" line below) carries the progress. */
  .gbscr-bar-row{
    position:relative;height:19px;
  }
  .gbscr-heart-wrap{
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:23px;height:20px;z-index:2;
  }
  .gbscr-bar-bg{
    position:absolute;left:13px;right:0;top:50%;transform:translateY(-50%);
    height:14px;background:rgba(0,0,0,.25);border-radius:7px;overflow:hidden;
  }
  .gbscr-bar-fill{
    display:block;height:100%;width:0%;background:#5A6F40;
    transition:width .8s cubic-bezier(.34,1.56,.64,1);
  }
  .gbscr-hud-notif{
    font-size:6.5px;color:var(--g1);letter-spacing:.5px;margin-top:5px;
    height:8px;opacity:0;transition:opacity .4s ease;
  }
  .gbscr-hud-notif.show{opacity:1;}

  .gbscr-char-wrap{
    /* Deliberately overlapping the dialogue box's top edge (not just
       touching it) so she reads as grounded/standing behind it rather
       than floating above it — the dialogue panel's z-index already
       covers her lower half. */
    position:absolute;bottom:46px;left:50%;transform:translateX(-50%);
    z-index:5;
    transition:transform .3s ease;
  }
  .gbscr-char-anim{
    /* Cropped waist-up (legs cut off) and displayed above native pixel
       size, so she reads as standing right up against the desk/camera
       instead of a small full-body figure lost in the scene. */
    width:252px;height:174px;
    background-image:url('./dolldefault.png');
    background-repeat:no-repeat;
    background-size:2268px 174px;
    image-rendering:pixelated;
    /* Plays through once per line (retriggered in JS) and settles back
       on the resting frame instead of looping forever — she "expresses"
       when a line starts, then holds still while it's being read. */
    animation:gbCharStrip 1.17s steps(9) 1;
    transition:opacity .16s ease;
  }
  @keyframes gbCharStrip{
    from{background-position-x:0;}
    to{background-position-x:-2268px;}
  }
  .gbscr-char-wrap.bounce{animation:gbCharBounce .5s ease;}
  @keyframes gbCharBounce{
    0%,100%{transform:translateX(-50%) translateY(0);}
    40%{transform:translateX(-50%) translateY(-10px);}
    70%{transform:translateX(-50%) translateY(-3px);}
  }

  .gbscr-dialogue{
    position:absolute;bottom:0;left:0;right:0;z-index:20;
  }
  .gbscr-dlg-name{
    position:relative;display:inline-block;margin:0 0 0 12px;
    background:var(--g0);color:var(--g4);
    font-size:7px;letter-spacing:1px;padding:5px 10px;
    border-radius:5px 5px 0 0;
  }
  .gbscr-dlg-panel{
    background:var(--g0);padding:9px 14px 12px;min-height:66px;position:relative;
  }
  .gbscr-dlg-text{
    font-size:8.5px;color:var(--g3);line-height:1.9;min-height:44px;
  }
  .gbscr-cursor{
    display:inline-block;width:6px;height:11px;background:var(--g4);
    margin-left:2px;vertical-align:middle;animation:gbBlink .7s infinite;
  }
  @keyframes gbBlink{0%,100%{opacity:1;}50%{opacity:0;}}
  .gbscr-hint{
    position:absolute;bottom:8px;right:10px;font-size:6.5px;color:var(--g3);opacity:.6;
    animation:gbBlink 1.2s infinite;display:none;
  }

  .gbscr-menu{
    position:absolute;inset:0;background:var(--g3);z-index:30;
    padding:12px 10px;display:none;flex-direction:column;gap:8px;
  }
  .gbscr-menu.open{display:flex;}
  .gbscr-menu-heading{
    font-size:8px;color:var(--g0);letter-spacing:1px;margin-bottom:2px;text-align:center;
  }
  .gbscr-topic{
    background:rgba(15,56,15,.14);border:none;border-radius:5px;
    padding:9px 12px;font-family:'Press Start 2P',monospace;font-size:7.5px;
    color:var(--g0);cursor:pointer;text-align:left;line-height:1.6;position:relative;
    text-transform:uppercase;transition:all .12s ease;
  }
  .gbscr-topic:hover:not(:disabled),
  .gbscr-topic.focused:not(:disabled){
    background:var(--g0);color:var(--g4);
    padding-left:20px;padding-right:20px;
  }
  .gbscr-topic.focused:not(:disabled)::before{
    content:'▶';position:absolute;left:6px;top:50%;transform:translateY(-50%);
    font-size:7px;animation:gbBlink .8s infinite;
  }
  .gbscr-topic.focused:not(:disabled)::after{
    content:'◀';position:absolute;right:6px;top:50%;transform:translateY(-50%);
    font-size:7px;animation:gbBlink .8s infinite;
  }
  .gbscr-topic:disabled{opacity:.5;cursor:default;}
  .gbscr-topic.done{text-decoration:line-through;opacity:.7;}

  .gbscr-loading{
    position:absolute;inset:0;background:var(--g3);z-index:40;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  }
  .gbscr-boot-title{
    font-size:16px;color:var(--g0);letter-spacing:1px;text-align:center;
  }
  .gbscr-boot-sub{font-size:7px;color:var(--g1);letter-spacing:2px;}
  .gbscr-boot-bar-bg{
    width:210px;height:9px;background:rgba(15,56,15,.2);border-radius:2px;overflow:hidden;
  }
  .gbscr-boot-bar-fill{
    height:100%;width:6%;background:var(--g0);
    transition:width 1.4s cubic-bezier(.22,.61,.36,1);
  }

  .gbscr-start{
    position:absolute;inset:0;background:var(--g3);z-index:40;
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  }
  .gbscr-title{
    font-size:18px;color:var(--g0);letter-spacing:2px;text-align:center;
  }
  .gbscr-press-hint{
    font-family:'Press Start 2P',monospace;font-size:8px;color:var(--g0);
    letter-spacing:1px;margin-top:6px;animation:gbBlink 1.1s infinite;
  }

  .gbscr-ending{
    position:absolute;inset:0;background:var(--g3);z-index:50;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;padding:20px;text-align:center;
  }
  .gbscr-ending.open{display:flex;}
  .gbscr-end-face{
    /* Static close-up of just her head, smiling — no animation, unlike the
       in-game sprite strips. */
    width:101px;height:107px;
    background-image:url('./dollhappyhead.png');
    background-repeat:no-repeat;
    background-size:101px 107px;
    image-rendering:pixelated;
  }
  .gbscr-end-title{font-size:11px;color:var(--g0);line-height:1.8;}
  .gbscr-end-msg{font-size:7.5px;color:var(--g1);line-height:2;}
  .gbscr-end-links{display:flex;flex-direction:column;gap:7px;margin-top:4px;width:100%;}
  .gbscr-end-link{
    font-family:'Press Start 2P',monospace;font-size:7.5px;color:var(--g0);
    text-decoration:none;background:rgba(15,56,15,.14);padding:9px 12px;border-radius:5px;
    position:relative;transition:all .12s ease;
  }
  /* Operable via the physical D-pad + A button, same focus language as the
     topic menu, so the ending links aren't mouse-only. */
  .gbscr-end-link.focused{
    background:var(--g0);color:var(--g4);
  }
  .gbscr-end-link.focused::before{
    content:'▶';position:absolute;left:6px;top:50%;transform:translateY(-50%);
    font-size:7px;animation:gbBlink .8s infinite;
  }
  .gbscr-end-link.focused::after{
    content:'◀';position:absolute;right:6px;top:50%;transform:translateY(-50%);
    font-size:7px;animation:gbBlink .8s infinite;
  }

  .gbscr-particle{
    position:fixed;pointer-events:none;z-index:9999;font-size:12px;color:var(--g0,#0f380f);
    animation:gbParticle 1.3s ease-out forwards;
  }
  @keyframes gbParticle{
    0%{opacity:1;transform:translateY(0) scale(1);}
    100%{opacity:0;transform:translateY(-60px) scale(.4) rotate(20deg);}
  }
</style>
</head>

  gatos: [
    { text: "Tenho quatro gatos: Francisco, Frederico, Alvinho e Sombra.", expr: 'cats' },
    { text: "Cada um com personalidade muito própria.", expr: 'cats' }
  ],
  comida: [
    { text: "Minha comida favorita do mundo, sem sombra de dúvida, é churrasco.", expr: 'happy' },
    { text: "Não tem dia ruim que um bom churrasco não resolva.", expr: 'excited' },
    { text: "Não recuso convite pra um churrasco", expr: 'happy' }
  ],
  segredo: [
    { text: "Okay, confissão...", expr: 'shy' },
    { text: "Sou viciada em Pinterest e consigo passar horas salvando referência sem perceber.", expr: 'excited' }
  ]
};

// Design & trabalho / Rotina & vida / Hobbies are always available; visiting
// all three unlocks Gatos, Comida and Segredo together.
const BASE_TOPICS = ['design', 'rotina', 'hobbies'];
const LOCKED_TOPICS = ['gatos', 'comida', 'segredo'];
const FRIENDSHIP_PER_TOPIC = 15;

let friendship = 0;
let visitedTopics = new Set();
let currentLines = [];
let currentIdx = 0;
let typing = false;
let typeTimer = null;
let phase = 'loading';

let screenEl, barFill, charWrap, charAnim, dlgText, dlgHint, menuScreen, startScreen, endingScreen,
    loadingScreen, bootBarFill, hudNotif, endLinkEls;

function initGame(root){
  screenEl     = root.querySelector('#gbLcd');
  barFill      = root.querySelector('#barFill');
  charWrap     = root.querySelector('#charWrap');
  charAnim     = root.querySelector('#charAnim');
  dlgText      = root.querySelector('#dlgText');
  dlgHint      = root.querySelector('#dlgHint');
  menuScreen   = root.querySelector('#menuScreen');
  startScreen  = root.querySelector('#startScreen');
  endingScreen = root.querySelector('#endingScreen');
  loadingScreen= root.querySelector('#loadingScreen');
  bootBarFill  = root.querySelector('#bootBarFill');
  hudNotif     = root.querySelector('#hudNotif');
  endLinkEls   = Array.from(root.querySelectorAll('[data-end-link]'));

  // Every on-screen control is physical-buttons-only, same as the rest of
  // the game — no mouse-click shortcut on the menu topics or the ending's
  // LinkedIn/email links. D-pad moves focus, A (mesh "b_low") confirms;
  // confirmMenuFocus()/confirmEndingFocus() do the actual selecting.
  endLinkEls.forEach((el) => {
    el.addEventListener('click', (e) => { e.preventDefault(); });
  });

  // Gameplay (start/advance/back) is driven by the physical console buttons
  // only — no click-to-advance on the screen itself. Keyboard stays as an
  // accessible fallback for the same three actions.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'z' || e.key === 'Z') {
      if (phase === 'start') beginGame();
      else if (phase === 'intro' || phase === 'dialogue') advance();
      else if (phase === 'menu') confirmMenuFocus();
      else if (phase === 'ending') confirmEndingFocus();
    }
    if (e.key === 'x' || e.key === 'X' || e.key === 'Escape') {
      goBack();
    }
    if (e.key === 'ArrowUp' && phase === 'menu') moveMenuFocus(-1);
    if (e.key === 'ArrowDown' && phase === 'menu') moveMenuFocus(1);
    if (e.key === 'ArrowUp' && phase === 'ending') moveEndingFocus(-1);
    if (e.key === 'ArrowDown' && phase === 'ending') moveEndingFocus(1);
  });
}

// Cosmetic in-screen boot sequence, played once the Game Boy is fully
// visible in 3D — the real GLTF/network loading is already done by this
// point (that's what the outer "carregando…" overlay covers); this is a
// fixed-length "ANAJU.EXE" splash purely for flavor, before the actual
// press-start screen.
const BOOT_MS = 1700;
function startBootSequence(){
  const scr = cssEl.querySelector('#gbLcd');
  scr.classList.add('gb-boot');
  setTimeout(() => scr.classList.remove('gb-boot'), 750);

  requestAnimationFrame(() => { bootBarFill.style.width = '100%'; });

  setTimeout(() => {
    playBootChime();
    loadingScreen.style.display = 'none';
    startScreen.style.display = 'flex';
    phase = 'start';
  }, BOOT_MS);
}

function beginGame(){
  if (phase !== 'start') return;
  playIntroJingle();
  startScreen.style.display = 'none';
  phase = 'intro';
  startDialogue('intro');
}

// Four animated poses exist (default, happy, jumping, cats) — "excited"
// plays the happy celebration, "cats" plays her holding the cats (and
// settles holding them, not empty-handed), and everything else (shy) falls
// back to the default speaking loop, which is also where most animations
// return to after playing once.
const CHAR_ANIM_SRC = {
  default: './dolldefault.png',
  happy: './dollhappy.png',
  jumping: './dolljumping.png',
  cats: './dollcats.png',
};
// Poses that should hold their last frame instead of reverting to frame 0 —
// she stays visibly holding the cats rather than snapping back empty-handed.
const HOLD_LAST_FRAME = new Set(['cats']);
// Matches .gbscr-char-anim's gbCharStrip keyframes (9 frames, 252px each,
// 1.17s). animation-fill-mode:forwards isn't used here on purpose: with
// steps(9) the animation's own end value lands one step past the last real
// frame (a blank sliver off the edge of the strip), so the hold is done by
// hand — let it finish, then freeze on the actual last frame's offset.
const CHAR_FRAME_W = 252, CHAR_FRAMES = 9, CHAR_ANIM_MS = 1170;
let currentCharAnim = 'default';
let holdFrameTimer = null;
function replayCharAnim(){
  clearTimeout(holdFrameTimer);
  charAnim.style.backgroundPositionX = '';
  charAnim.style.animation = 'none';
  void charAnim.offsetWidth;
  charAnim.style.animation = '';
  if (HOLD_LAST_FRAME.has(currentCharAnim)) {
    holdFrameTimer = setTimeout(() => {
      charAnim.style.animation = 'none';
      charAnim.style.backgroundPositionX = -(CHAR_FRAME_W * (CHAR_FRAMES - 1)) + 'px';
    }, CHAR_ANIM_MS);
  }
}
// Called once per dialogue line, not just on pose change, so she plays
// the little "expression" motion fresh for every line (the CSS animation
// itself runs once then settles — see .gbscr-char-anim) instead of either
// looping forever or staying frozen across a run of same-pose lines.
function setCharAnim(name){
  if (!CHAR_ANIM_SRC[name]) return;
  if (name === currentCharAnim) {
    // Hold poses (cats) stay exactly as settled across lines of the same
    // topic — she doesn't let go and re-grab the cats every line.
    if (!HOLD_LAST_FRAME.has(name)) replayCharAnim();
    return;
  }
  currentCharAnim = name;
  charAnim.style.opacity = '0';
  setTimeout(() => {
    charAnim.style.backgroundImage = `url('${CHAR_ANIM_SRC[name]}')`;
    replayCharAnim();
    charAnim.style.opacity = '1';
  }, 160);
}
function setExpr(expr){
  setCharAnim(expr === 'excited' ? 'happy' : expr === 'cats' ? 'cats' : 'default');
}

function typeText(text, onDone){
  dlgText.innerHTML = '';
  dlgHint.style.display = 'none';
  typing = true;
  let i = 0;
  clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    i++;
    dlgText.innerHTML = text.slice(0, i) + '<span class="gbscr-cursor"></span>';
    if (i >= text.length) {
      clearInterval(typeTimer);
      dlgText.innerHTML = text;
      typing = false;
      if (onDone) onDone();
    }
  }, 32);
}

function skipTyping(){
  clearInterval(typeTimer);
  const line = currentLines[currentIdx];
  dlgText.innerHTML = line.text;
  typing = false;
  dlgHint.style.display = 'block';
}

function showLine(idx){
  if (idx >= currentLines.length) return;
  const line = currentLines[idx];
  setExpr(line.expr);
  typeText(line.text, () => { dlgHint.style.display = 'block'; });
}

function advance(){
  if (typing) { skipTyping(); return; }
  currentIdx++;
  if (currentIdx >= currentLines.length) {
    if (phase === 'intro' || phase === 'dialogue') openMenu();
  } else {
    showLine(currentIdx);
  }
}

function goBack(){
  if (phase === 'dialogue' || phase === 'intro') {
    clearInterval(typeTimer);
    typing = false;
    openMenu();
  }
}

function updateFriendshipBar(pct){
  barFill.style.width = pct + '%';
}

function startDialogue(key){
  phase = 'dialogue';
  menuScreen.classList.remove('open');
  currentLines = DIALOGUES[key];
  currentIdx = 0;

  if (key !== 'intro' && !visitedTopics.has(key)) {
    visitedTopics.add(key);
    setTimeout(() => {
      friendship = Math.min(100, friendship + FRIENDSHIP_PER_TOPIC);
      updateFriendshipBar(friendship);
      bounceChar();
      spawnParticles();
      showHudNotif('+' + FRIENDSHIP_PER_TOPIC + ' pts');
      checkUnlocks(key);
    }, 600);
  }
  showLine(0);
}

function openMenu(){
  phase = 'menu';
  menuScreen.classList.add('open');
  setExpr('happy');
  dlgHint.style.display = 'none';
  dlgText.innerHTML = '';

  screenEl.querySelectorAll('.gbscr-topic[data-topic]').forEach(btn => {
    const t = btn.getAttribute('data-topic');
    if (visitedTopics.has(t)) btn.classList.add('done');
  });

  const avail = getAvailableTopicIndices();
  setMenuFocus(avail.length ? avail[0] : 0);

  if (TOPIC_KEYS.every(t => visitedTopics.has(t))) {
    setTimeout(showEnding, 400);
  }
}

/* ---- D-pad menu navigation (up/down moves focus, A/Start confirms) ---- */
const TOPIC_KEYS = [...BASE_TOPICS, ...LOCKED_TOPICS];
let menuFocusIndex = 0;

function getAvailableTopicIndices(){
  return TOPIC_KEYS
    .map((k, i) => i)
    .filter(i => {
      const btn = screenEl.querySelector(`.gbscr-topic[data-topic="${TOPIC_KEYS[i]}"]`);
      return btn && !btn.disabled;
    });
}

function setMenuFocus(idx){
  menuFocusIndex = idx;
  screenEl.querySelectorAll('.gbscr-topic').forEach(b => b.classList.remove('focused'));
  const btn = screenEl.querySelector(`.gbscr-topic[data-topic="${TOPIC_KEYS[menuFocusIndex]}"]`);
  if (btn) btn.classList.add('focused');
}

function moveMenuFocus(dir){
  const avail = getAvailableTopicIndices();
  if (!avail.length) return;
  let pos = avail.indexOf(menuFocusIndex);
  if (pos === -1) pos = 0;
  pos = (pos + dir + avail.length) % avail.length;
  setMenuFocus(avail[pos]);
}

function confirmMenuFocus(){
  const btn = screenEl.querySelector(`.gbscr-topic[data-topic="${TOPIC_KEYS[menuFocusIndex]}"]`);
  if (!btn || btn.disabled) return;
  menuScreen.classList.remove('open');
  startDialogue(btn.getAttribute('data-topic'));
}

// Each base topic unlocks exactly one locked topic on its own, the moment
// it's visited — not all three at once after finishing all base topics.
const UNLOCK_MAP = { design: 'gatos', rotina: 'comida', hobbies: 'segredo' };
function checkUnlocks(visitedKey){
  const target = UNLOCK_MAP[visitedKey];
  if (!target) return;
  const btn = screenEl.querySelector(`.gbscr-topic[data-topic="${target}"]`);
  if (!btn || !btn.disabled) return;
  btn.disabled = false;
  btn.textContent = btn.getAttribute('data-label');
  showHudNotif('nova pergunta desbloqueada');
}

/* Friendship-bar feedback ("+N pts", "nova pergunta desbloqueada") is
   queued so a topic visit and an unlock landing in the same tick don't
   clobber each other — each message gets its full time on screen. */
let hudNotifQueue = [];
let hudNotifBusy = false;
function showHudNotif(msg){
  hudNotifQueue.push(msg);
  if (!hudNotifBusy) processHudNotifQueue();
}
function processHudNotifQueue(){
  if (!hudNotifQueue.length) { hudNotifBusy = false; return; }
  hudNotifBusy = true;
  hudNotif.textContent = hudNotifQueue.shift();
  hudNotif.classList.add('show');
  setTimeout(() => {
    hudNotif.classList.remove('show');
    setTimeout(processHudNotifQueue, 300);
  }, 1600);
}

function showEnding(){
  phase = 'ending';
  endingScreen.classList.add('open');
  setEndingFocus(0);
  for (let i = 0; i < 4; i++) setTimeout(spawnParticles, i * 350);
}

/* ---- D-pad navigation for the ending screen's linkedin/email links ---- */
let endingFocusIndex = 0;
function setEndingFocus(idx){
  endingFocusIndex = idx;
  endLinkEls.forEach(el => el.classList.remove('focused'));
  if (endLinkEls[idx]) endLinkEls[idx].classList.add('focused');
}
function moveEndingFocus(dir){
  if (!endLinkEls.length) return;
  const next = (endingFocusIndex + dir + endLinkEls.length) % endLinkEls.length;
  setEndingFocus(next);
}
function confirmEndingFocus(){
  const el = endLinkEls[endingFocusIndex];
  if (!el) return;
  if (el.target === '_blank') window.open(el.href, '_blank', 'noopener');
  else window.location.href = el.href;
}

function bounceChar(){
  charWrap.classList.remove('bounce');
  void charWrap.offsetWidth;
  charWrap.classList.add('bounce');
}

function spawnParticles(){
  // Plain glyphs, not emoji — emoji render as fixed-color bitmaps and
  // would break the green-only palette; these inherit `color` instead.
  const glyphs = ['♥', '✦', '•'];
  const rect = screenEl.getBoundingClientRect();
  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.className = 'gbscr-particle';
      p.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
      p.style.left = (rect.left + Math.random() * rect.width) + 'px';
      p.style.top  = (rect.top + Math.random() * rect.height * 0.6 + rect.height * 0.15) + 'px';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1400);
    }, i * 150);
  }
}

/* ══════════════════════════════════════════════════════════════
   PART 2 — THE 3D GAME BOY
   ══════════════════════════════════════════════════════════════ */

const wrap   = document.getElementById('gbWrap');
const canvas = document.getElementById('gbCanvas');
const cssEl  = document.getElementById('gbCss3d');
const loadingEl = document.getElementById('gbLoading');
const muteBtn = document.getElementById('muteBtn');

cssEl.innerHTML = SCREEN_HTML;
initGame(cssEl);

const HIDDEN_PREFIXES = ['cartridge_low', 'chip_low', 'lockOpen_low'];
const CONTROL_NAMES = new Set(['a_low','b_low','select_low','switch_low','movement_low','movementknobs_low']);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 10);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, stencil: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(0.4, 0.6, 0.9);
scene.add(keyLight);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const cssRenderer = new CSS3DRenderer({ element: cssEl });

const webglGroup = new THREE.Group();
scene.add(webglGroup);

const cssScene = new THREE.Scene();
const cssGroup = new THREE.Group();
cssScene.add(cssGroup);

let modelCenter = new THREE.Vector3();
let modelSize = new THREE.Vector3(90, 149, 39);
let screenObj = null;
let interactiveMeshes = [];
const controlNodes = {};

const loader = new GLTFLoader();
loader.load('./gameboy.glb', (gltf) => {
  const root = gltf.scene;
  webglGroup.add(root);

  root.traverse((obj) => {
    if (HIDDEN_PREFIXES.some(p => obj.name && obj.name.startsWith(p))) {
      obj.visible = false;
    }
  });

  root.traverse((obj) => {
    if (CONTROL_NAMES.has(obj.name) && !controlNodes[obj.name]) {
      controlNodes[obj.name] = obj;
      obj.userData.restZ = obj.position.z;
      obj.userData.restRotX = obj.rotation.x;
      obj.userData.restRotY = obj.rotation.y;
    }
  });

  root.traverse((obj) => {
    if (obj.isMesh) {
      obj.frustumCulled = false;
      interactiveMeshes.push(obj);
      // The shell material is authored doubleSided; with the screen glass
      // hidden that lets the camera see straight through to the mirrored
      // backside of the case interior. Force front-face-only so that gap
      // is a clean transparent hole instead.
      if (obj.material) obj.material.side = THREE.FrontSide;
    }
  });

  // NOTE: the mesh literally named "Plane009" (material "Black_Screen") is a
  // stray Sketchfab prop sitting near the speaker grille, NOT the LCD glass.
  // The actual screen opening is covered by two overlapping meshes —
  // "screen_low" (the flat glass, printed with the BATTERY/DOT MATRIX labels)
  // and "screenHolder_low" (the raised bezel around it, larger than the
  // glass) — both need to be hidden or the bezel's own baked texture shows
  // through where the CSS3D content should be. We reproduce the printed
  // labels in the CSS3D screen's own markup instead.
  let screenPanel = null;
  let screenHolder = null;
  root.traverse((obj) => {
    if (obj.name === 'screen_low_External_0') screenPanel = obj;
    if (obj.name === 'screenHolder_low_External_0') screenHolder = obj;
  });

  // Box3.setFromObject ignores .visible, which would pull the (hidden)
  // cartridges back into the fit — walk only meshes that are actually
  // visible (including up the ancestor chain).
  const box = new THREE.Box3();
  root.traverse((obj) => {
    if (!obj.isMesh) return;
    let vis = true, p = obj;
    while (p) { if (p.visible === false) { vis = false; break; } p = p.parent; }
    if (vis) box.expandByObject(obj);
  });
  box.getSize(modelSize);
  box.getCenter(modelCenter);

  // CSS3DRenderer treats three.js scene units as CSS pixels 1:1 (no unit
  // conversion of its own). The glTF model is authored in meters (~0.03-0.15),
  // which collapses to sub-pixel offsets once turned into a CSS matrix3d.
  // Rescale the whole rig into a "1 unit ≈ 1 px" range so both renderers agree.
  const WORLD_SCALE = 1000;
  webglGroup.scale.setScalar(WORLD_SCALE);
  webglGroup.updateMatrixWorld(true);
  modelCenter.multiplyScalar(WORLD_SCALE);
  modelSize.multiplyScalar(WORLD_SCALE);

  if (screenPanel) screenPanel.visible = false;
  // screenHolder (the raised bezel around the glass) is left visible on
  // purpose — it renders as the grey plastic frame around the green
  // screen, same as the real console. Only the flat glass pane
  // (screenPanel) is hidden and replaced by the CSS3D content, sized to
  // the glass's own (smaller) footprint rather than the bezel's.

  if (screenPanel) {
    screenPanel.updateWorldMatrix(true, false);
    screenPanel.geometry.computeBoundingBox();
    const lb = screenPanel.geometry.boundingBox;
    const zNudge = lb.max.z || 0.5;

    const corners = [
      new THREE.Vector3(lb.min.x, lb.min.y, zNudge),
      new THREE.Vector3(lb.max.x, lb.min.y, zNudge),
      new THREE.Vector3(lb.max.x, lb.max.y, zNudge),
      new THREE.Vector3(lb.min.x, lb.max.y, zNudge),
    ].map(v => screenPanel.localToWorld(v));

    const screenCenter = new THREE.Vector3();
    corners.forEach(c => screenCenter.add(c));
    screenCenter.multiplyScalar(0.25);

    const screenWidth = corners[0].distanceTo(corners[1]);
    const screenHeight = corners[1].distanceTo(corners[2]);
    const screenQuat = new THREE.Quaternion();
    screenPanel.getWorldQuaternion(screenQuat);

    // The shell has a thin structural rim inside the screen cavity that
    // becomes visible once the glass mesh is hidden — a flat colored
    // "patch" mesh used to cover it, but that just hid whatever game UI
    // happened to sit behind it instead. Punch a proper hole with the
    // stencil buffer: a dedicated rect (guaranteed solid, unlike
    // screenPanel's own geometry which may not be) writes a stencil
    // marker over the LCD area, and every other opaque mesh (including
    // the now-visible bezel) discards fragments there, so nothing behind
    // the glass can show through it regardless of camera angle.
    const stencilLocalPos = new THREE.Vector3((lb.min.x + lb.max.x) / 2, (lb.min.y + lb.max.y) / 2, zNudge);
    const stencilWorldPos = screenPanel.localToWorld(stencilLocalPos.clone());
    const stencilGeo = new THREE.PlaneGeometry(screenWidth / WORLD_SCALE, screenHeight / WORLD_SCALE);
    const stencilMat = new THREE.MeshBasicMaterial({
      colorWrite: false, depthWrite: false,
      stencilWrite: true, stencilFunc: THREE.AlwaysStencilFunc,
      stencilZPass: THREE.ReplaceStencilOp, stencilRef: 1,
    });
    const stencilMesh = new THREE.Mesh(stencilGeo, stencilMat);
    stencilMesh.quaternion.copy(screenQuat);
    stencilMesh.renderOrder = -1;
    root.add(stencilMesh);
    root.worldToLocal(stencilWorldPos);
    stencilMesh.position.copy(stencilWorldPos);

    interactiveMeshes.forEach((obj) => {
      obj.material.stencilWrite = true;
      obj.material.stencilFunc = THREE.NotEqualStencilFunc;
      obj.material.stencilRef = 1;
      obj.material.stencilFail = THREE.KeepStencilOp;
      obj.material.stencilZFail = THREE.KeepStencilOp;
      obj.material.stencilZPass = THREE.KeepStencilOp;
    });

    const domW = 380, domH = 288;
    const cssObject = new CSS3DObject(cssEl.querySelector('#gbscr'));
    cssObject.position.copy(screenCenter);
    cssObject.quaternion.copy(screenQuat);
    // Slight overscan (grows symmetrically from center, so it stays
    // centered) so the flat CSS rectangle always fully covers the
    // stencil-punched hole, including at its rounded corners — without
    // this a hairline gap can reveal the page background behind it,
    // especially as the model tilts with the mouse.
    const OVERSCAN = 1.035;
    cssObject.scale.set(screenWidth / domW * OVERSCAN, screenHeight / domH * OVERSCAN, (screenWidth / domW + screenHeight / domH) / 2);
    cssGroup.add(cssObject);
    screenObj = cssObject;
  }

  fitCamera();
  loadingEl.classList.add('hide');
  wrap.classList.add('is-loaded');

  requestAnimationFrame(startBootSequence);
}, undefined, (err) => {
  console.error('Failed to load Game Boy model', err);
  loadingEl.textContent = 'não foi possível carregar o modelo 3D';
});

function fitCamera(){
  const fovRad = camera.fov * Math.PI / 180;
  const tanHalfV = Math.tan(fovRad / 2);
  // Fit height and width independently — the console is much taller than it
  // is wide, so treating both as a single "max dimension" (as a naive fit
  // does) way overshoots the required distance and leaves it tiny on-screen.
  const fitHeightDist = (modelSize.y / 2) / tanHalfV;
  const fitWidthDist = (modelSize.x / 2) / (tanHalfV * camera.aspect);
  const dist = 1.15 * Math.max(fitHeightDist, fitWidthDist);
  camera.position.set(modelCenter.x, modelCenter.y, modelCenter.z + dist);
  camera.near = dist / 50;
  camera.far = dist * 20;
  camera.lookAt(modelCenter);
  camera.updateProjectionMatrix();
}

let lastSizeW = 0, lastSizeH = 0;
function resize(){
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h || (w === lastSizeW && h === lastSizeH)) return;
  lastSizeW = w; lastSizeH = h;
  camera.aspect = w / h;
  fitCamera();
  renderer.setSize(w, h, false);
  cssRenderer.setSize(w, h);
}
window.addEventListener('resize', resize);
// wrap's own box can change size for reasons that never fire a window
// resize (dvh shifting as mobile browser chrome shows/hides, fonts
// loading late and reflowing, etc). If that drifts out from under the
// renderer's last-known size, the WebGL canvas and the CSS3D layer stop
// agreeing on the camera/perspective math and the screen visibly
// detaches from the console — watch the element itself directly instead.
new ResizeObserver(resize).observe(wrap);
resize();

/* ---- subtle mouse-follow tilt ("leves giradas") ---- */
const MAX_YAW = 0.28, MAX_PITCH = 0.13;
let targetYaw = 0, targetPitch = 0;
let curYaw = 0, curPitch = 0;
let idleT = 0;

const pointerFine = window.matchMedia('(pointer: fine)').matches;

if (pointerFine) {
  window.addEventListener('mousemove', (e) => {
    const r = wrap.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const nx = THREE.MathUtils.clamp((e.clientX - cx) / (window.innerWidth / 2), -1, 1);
    const ny = THREE.MathUtils.clamp((e.clientY - cy) / (window.innerHeight / 2), -1, 1);
    targetYaw = nx * MAX_YAW;
    targetPitch = ny * MAX_PITCH;
  });
}

/* ---- clickable buttons via raycasting ---- */
const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();

function findControlName(obj){
  let cur = obj;
  while (cur) {
    if (CONTROL_NAMES.has(cur.name)) return cur.name;
    cur = cur.parent;
  }
  return null;
}

function raycastAt(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  pointerNdc.x = ((clientX - r.left) / r.width) * 2 - 1;
  pointerNdc.y = -((clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointerNdc, camera);
  const hits = raycaster.intersectObjects(interactiveMeshes, false);
  if (!hits.length) return null;
  return { name: findControlName(hits[0].object), point: hits[0].point };
}

// Which way the D-pad was pressed: project the world-space hit point into
// the pad's own local space and see which arm (up/down/left/right) it's
// closest to, so it can drive discrete menu navigation instead of just a
// single "press" like the other buttons.
function getDpadDirection(point){
  const node = controlNodes['movement_low'] || controlNodes['movementknobs_low'];
  if (!node || !point) return null;
  const local = node.worldToLocal(point.clone());
  return Math.abs(local.y) >= Math.abs(local.x)
    ? (local.y > 0 ? 'up' : 'down')
    : (local.x > 0 ? 'right' : 'left');
}

// The model has a single combined mesh ("select_low") spanning both the
// SELECT and START oblong buttons — split it by local x to tell which
// physical button was actually pressed (right half is START). Measured by
// raycasting across the mesh: local x runs roughly -12.5 (left edge of
// Select) to +12.1 (right edge of Start), so the true midpoint is ~0, not
// the old -5.05 which misread most of Select's own half as Start too.
const SELECT_START_MID_X = -0.2;
function getSelectStartSide(point){
  const node = controlNodes['select_low'];
  if (!node || !point) return null;
  const local = node.worldToLocal(point.clone());
  return local.x > SELECT_START_MID_X ? 'start' : 'select';
}

let powerOn = true;

/* ---- tactile feedback: click sound + button sinks in, then springs back ---- */
const PRESS_DEPTH = { a_low: 1.4, b_low: 1.4, select_low: 1.0, movement_low: 0.9, movementknobs_low: 0.9 };
const HOLD_MS = 90, SPRING_MS = 140;
// D-pad is a single rigid rocker, like the real hardware — pressing one arm
// tilts the whole cross so the opposite arm lifts slightly, instead of the
// whole pad sinking in flat like the other (independent) buttons.
const DPAD_TILT = 0.24;
const DPAD_TILT_AXIS = { up: ['x', -1], down: ['x', 1], left: ['y', -1], right: ['y', 1] };
const pressedAt = new Map(); // name -> { t0, dir }

// Everything routes through one master gain node so the single mute button
// silences all of it (background music, clicks, chimes) at once.
let audioCtx = null, masterGain = null, isMuted = false;
function ensureAudio(){
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = isMuted ? 0 : 1;
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playClick(){
  try {
    const ctx = ensureAudio();
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1200, t0);
    osc.frequency.exponentialRampToValueAtTime(380, t0 + 0.04);
    gain.gain.setValueAtTime(0.16, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.045);
    osc.connect(gain).connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + 0.05);
  } catch (e) { /* audio not available — silently skip */ }
}

function playIntroJingle(){
  try {
    const ctx = ensureAudio();
    const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6 — a little "power on" arpeggio
    const t0 = ctx.currentTime;
    notes.forEach((freq, i) => {
      const start = t0 + i * 0.11;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.14, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);
      osc.connect(gain).connect(masterGain);
      osc.start(start);
      osc.stop(start + 0.22);
    });
  } catch (e) { /* audio not available — silently skip */ }
}

function playBootChime(){
  try {
    const ctx = ensureAudio();
    const notes = [659.25, 987.77]; // E5, B5 — short "ready" chime
    const t0 = ctx.currentTime;
    notes.forEach((freq, i) => {
      const start = t0 + i * 0.09;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.16, start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.18);
      osc.connect(gain).connect(masterGain);
      osc.start(start);
      osc.stop(start + 0.2);
    });
  } catch (e) { /* audio not available — silently skip */ }
}

// One gentle looping melody that plays for the whole visit — starts at
// page load (not gated behind a click on the console) and keeps going
// through loading, dialogue, menu and the ending alike, instead of being
// swapped out at each phase transition. The boot/intro/click sounds above
// still layer short accents on top of it.
const BG_NOTE_S = 0.32;
const BG_MELODY = [
  523.25, null, 587.33, 659.25, null, 783.99, 659.25, null,
  523.25, null, 440.00, 523.25, null, 587.33, 493.88, null,
  440.00, null, 523.25, 587.33, null, 659.25, 587.33, null,
  523.25, null, 493.88, 440.00, null, 392.00, 440.00, null,
];
let bgMusicTimer = null, bgIdx = 0;
function bgMusicTick(){
  try {
    const ctx = ensureAudio();
    const freq = BG_MELODY[bgIdx % BG_MELODY.length];
    bgIdx++;
    if (!freq) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle'; // softer than the square-wave sfx, sits underneath them
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.045, t0 + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + BG_NOTE_S * 0.92);
    osc.connect(gain).connect(masterGain);
    osc.start(t0);
    osc.stop(t0 + BG_NOTE_S);
  } catch (e) { /* audio not available — silently skip */ }
}
function startBgMusic(){
  if (bgMusicTimer) return;
  ensureAudio();
  bgMusicTick();
  bgMusicTimer = setInterval(bgMusicTick, BG_NOTE_S * 1000);
}

const MUTE_ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';
const MUTE_ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="22" y1="9" x2="16" y2="15"></line><line x1="16" y1="9" x2="22" y2="15"></line></svg>';
function setMuted(muted){
  isMuted = muted;
  if (masterGain) masterGain.gain.setTargetAtTime(muted ? 0 : 1, audioCtx.currentTime, 0.01);
  if (muteBtn) {
    muteBtn.innerHTML = muted ? MUTE_ICON_OFF : MUTE_ICON_ON;
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? 'ativar som' : 'silenciar');
  }
}
if (muteBtn) muteBtn.addEventListener('click', () => setMuted(!isMuted));

// Browsers block audio until a user gesture — true autoplay before any
// interaction isn't possible, that's a platform policy no page can
// override. Best effort: start the music engine immediately on load (so
// it's already running the instant the browser allows sound) and resume
// the context on the very first sign of ANY input, not just a click on
// the console itself.
startBgMusic();
['pointerdown', 'pointerup', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(evt => {
  window.addEventListener(evt, () => {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }, { once: true, passive: true });
});

function pressControl(name, dpadDir){
  const isDpad = name === 'movement_low' || name === 'movementknobs_low';
  if (isDpad && dpadDir && DPAD_TILT_AXIS[dpadDir]) {
    // Rock both D-pad meshes together (they're overlapping pieces of the
    // same rigid cross) — whichever arm was hit sinks, the opposite arm
    // rises, rather than the whole pad sinking in evenly.
    const [axis, sign] = DPAD_TILT_AXIS[dpadDir];
    ['movement_low', 'movementknobs_low'].forEach((n) => {
      const node = controlNodes[n];
      const depth = PRESS_DEPTH[n];
      if (!node || !depth) return;
      node.position.z = node.userData.restZ - depth * 0.5;
      node.rotation[axis] = node.userData['restRot' + axis.toUpperCase()] + sign * DPAD_TILT;
      pressedAt.set(n, { t0: performance.now(), dir: dpadDir });
    });
  } else {
    const node = controlNodes[name];
    const depth = PRESS_DEPTH[name];
    if (node && depth) {
      node.position.z = node.userData.restZ - depth;
      pressedAt.set(name, { t0: performance.now(), dir: null });
    }
  }
  playClick();
}

function handleControl(hit){
  const name = hit && hit.name;
  if (!name) return;
  const dpadDir = (name === 'movement_low' || name === 'movementknobs_low') ? getDpadDirection(hit.point) : null;
  pressControl(name, dpadDir);
  switch (name) {
    // NOTE: the glTF's own mesh names are swapped from the silkscreened
    // labels — the mesh named "a_low" sits where the shell is printed "B",
    // and "b_low" sits where it's printed "A". Map by the printed label,
    // not the mesh name.
    case 'b_low':
      if (phase === 'intro' || phase === 'dialogue') advance();
      else if (phase === 'menu') confirmMenuFocus();
      else if (phase === 'ending') confirmEndingFocus();
      break;
    case 'select_low':
      // Select (left half) does nothing in this game — only Start (right
      // half) begins it.
      if (getSelectStartSide(hit.point) === 'start' && phase === 'start') beginGame();
      break;
    case 'a_low':
      goBack();
      break;
    case 'movement_low':
    case 'movementknobs_low':
      if (phase === 'menu') {
        const dir = getDpadDirection(hit.point);
        if (dir === 'up') moveMenuFocus(-1);
        else if (dir === 'down') moveMenuFocus(1);
      } else if (phase === 'ending') {
        const dir = getDpadDirection(hit.point);
        if (dir === 'up') moveEndingFocus(-1);
        else if (dir === 'down') moveEndingFocus(1);
      }
      // Advancing dialogue is A-only (case 'b_low' above) — the D-pad no
      // longer doubles as an advance button during dialogue.
      break;
    case 'switch_low':
      togglePower();
      break;
  }
}

function togglePower(){
  const scr = cssEl.querySelector('#gbLcd');
  powerOn = !powerOn;
  if (!powerOn) {
    scr.classList.add('gb-off');
  } else {
    scr.classList.remove('gb-off');
    scr.classList.add('gb-boot');
    setTimeout(() => scr.classList.remove('gb-boot'), 750);
  }
}

wrap.addEventListener('pointerdown', (e) => {
  const hit = raycastAt(e.clientX, e.clientY);
  if (hit) handleControl(hit);
});

wrap.addEventListener('pointermove', (e) => {
  const hit = raycastAt(e.clientX, e.clientY);
  wrap.style.cursor = (hit && hit.name) ? 'pointer' : '';
});
wrap.addEventListener('pointerleave', () => { wrap.style.cursor = ''; });

/* ---- render loop ---- */
function animate(t){
  requestAnimationFrame(animate);

  if (!pointerFine) {
    idleT += 0.01;
    targetYaw = Math.sin(idleT) * MAX_YAW * 0.5;
    targetPitch = Math.cos(idleT * 0.8) * MAX_PITCH * 0.4;
  }

  curYaw += (targetYaw - curYaw) * 0.06;
  curPitch += (targetPitch - curPitch) * 0.06;

  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(curPitch, curYaw, 0, 'YXZ'));
  webglGroup.quaternion.copy(q);
  cssGroup.quaternion.copy(q);

  if (pressedAt.size) {
    const now = performance.now();
    pressedAt.forEach(({ t0, dir }, name) => {
      const node = controlNodes[name];
      const depth = PRESS_DEPTH[name];
      if (!node) { pressedAt.delete(name); return; }
      const elapsed = now - t0;
      if (elapsed <= HOLD_MS) return;
      const isDpad = (name === 'movement_low' || name === 'movementknobs_low') && dir && DPAD_TILT_AXIS[dir];
      const restZ = node.userData.restZ;
      const pressedZ = restZ - depth * (isDpad ? 0.5 : 1);
      const springT = Math.min(1, (elapsed - HOLD_MS) / SPRING_MS);
      const eased = 1 - Math.pow(1 - springT, 3);
      node.position.z = pressedZ + (restZ - pressedZ) * eased;
      if (isDpad) {
        const [axis, sign] = DPAD_TILT_AXIS[dir];
        const restRot = node.userData['restRot' + axis.toUpperCase()];
        const pressedRot = restRot + sign * DPAD_TILT;
        node.rotation[axis] = pressedRot + (restRot - pressedRot) * eased;
      }
      if (springT >= 1) pressedAt.delete(name);
    });
  }

  renderer.render(scene, camera);
  cssRenderer.render(cssScene, camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
